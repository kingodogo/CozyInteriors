pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0'
}

rootProject.name = 'cozyinteriors'

include 'Versions:1.18.2'
include 'Versions:1.19'
include 'Versions:1.20.1'
include 'Versions:1.20.2'
include 'Versions:1.20.3'
include 'Versions:1.20.4'
include 'Versions:1.20.5'
include 'Versions:1.20.6'
include 'Versions:1.21'
include 'Versions:1.21.1'

project(':Versions:1.18.2').projectDir = file('Versions/1.18.2')
project(':Versions:1.19').projectDir = file('Versions/1.19')
project(':Versions:1.20.1').projectDir = file('Versions/1.20.1')
project(':Versions:1.20.2').projectDir = file('Versions/1.20.2')
project(':Versions:1.20.3').projectDir = file('Versions/1.20.3')
project(':Versions:1.20.4').projectDir = file('Versions/1.20.4')
project(':Versions:1.20.5').projectDir = file('Versions/1.20.5')
project(':Versions:1.20.6').projectDir = file('Versions/1.20.6')
project(':Versions:1.21').projectDir = file('Versions/1.21')
project(':Versions:1.21.1').projectDir = file('Versions/1.21.1')

